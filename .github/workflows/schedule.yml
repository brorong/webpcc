name: Daily EV Tenders Scraper

on:
  schedule:
    # 每天台灣時間早上 07:30 執行 (UTC 23:30)
    - cron: '30 23 * * *'
  workflow_dispatch: # 允許手動點擊執行

jobs:
  run-scraper-and-email:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scraper
      # 【關鍵修復】：在這裡把 GitHub Secrets 確實傳遞給 Python
      env:
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        PYTHONUNBUFFERED: 1  # 強制讓 Python 的所有錯誤或警告訊息即時顯示
      run: python scraper.py

    - name: Upload Debug Page
      # 抓取失敗時，把爬蟲實際收到的網頁上傳，方便判斷是否被網站阻擋
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: debug-page
        path: debug_page.html
        if-no-files-found: ignore
